<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F4F1ED">
<title>Seiva</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-512.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Seiva">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* VOICE: calmo, pessoal, premium — um organizador que some atrás do conteúdo.
   IDEA: o Seiva no estilo B (Cartões suaves) virando padrão, com um sistema de ícones próprio (azulejos em degradê).
   PICTURE: computador com menu e Hoje; celulares com Hoje, Agenda, Tarefas, Adicionar, galeria de cartões, Caderno, menu e ajustes.
   COLOUR and TYPE: laranja Seiva #D9622B em ação; cada turno e área com um degradê próprio; preto fosco no escuro; Manrope 12/13/15/17/20/26/34/44.
   LAYOUT: barra de escolha no topo; computador em escala; celulares em fileiras que quebram. */
:root{--marca:#D9622B;--marca-f:#B44E1F;--marca-s:#FBE7DB;--feito:#2F8F5B;--atraso:#C2362F;--mov:cubic-bezier(.2,.8,.2,1);
  --fundo:#F4F1ED;--sup:#FFFFFF;--afund:#EEE9E4;--linha:#E6DED6;--tinta:#1F1A16;--apag:#6E635A;--pg:#E9E5E0;--pg-tx:#1F1A16;
  --luz:radial-gradient(900px 500px at 0% 0%,rgba(217,98,43,.07),transparent 60%),radial-gradient(700px 400px at 100% 100%,rgba(245,158,11,.05),transparent 60%);
  --sombra:0 1px 1px rgba(31,26,22,.03),0 2px 4px -2px rgba(31,26,22,.05),0 14px 32px -18px rgba(120,60,25,.28);
  --sombra-s:0 1px 1px rgba(31,26,22,.03),0 10px 22px -16px rgba(120,60,25,.32);
  --brilho:inset 0 1px 0 rgba(255,255,255,.9);
  --vidro:rgba(255,255,255,.72)}
:root[data-tema=escuro]{--fundo:#0E0E0F;--sup:#18181A;--afund:#222224;--linha:#2A2A2D;--tinta:#F2F2F2;--apag:#9C9CA1;--marca-s:rgba(217,98,43,.16);--pg:#060606;--pg-tx:#F2F2F2;
  --luz:radial-gradient(900px 500px at 0% 0%,rgba(217,98,43,.08),transparent 60%);
  --sombra:0 0 0 1px #26262A,0 14px 32px -18px rgba(0,0,0,.9);--sombra-s:0 0 0 1px #26262A;--brilho:inset 0 1px 0 rgba(255,255,255,.05);--vidro:rgba(30,30,32,.7)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--pg);color:var(--pg-tx);font:500 15px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- barra de escolha ---------- */
.esc{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px max(4vw,16px);background:color-mix(in srgb,var(--pg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--pg-tx) 8%,transparent)}
.esc h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.esc h1 svg{width:24px;height:24px;border-radius:7px}
.esc .gr{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:color-mix(in srgb,var(--pg-tx) 55%,transparent)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--pg-tx) 7%,transparent)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;min-height:34px;color:color-mix(in srgb,var(--pg-tx) 70%,transparent)}
.seg button[aria-pressed=true]{background:var(--pg-tx);color:var(--pg)}
main{padding:24px max(4vw,16px) 64px;display:flex;flex-direction:column;gap:16px}
.rot{margin:28px 0 0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.rot small{display:block;font-size:13px;font-weight:600;color:color-mix(in srgb,var(--pg-tx) 55%,transparent)}

/* ---------- sistema de ícones: azulejo em degradê, desenho branco, brilho no alto ---------- */
.az{--a:#8A8F98;--b:#5E636B;width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;position:relative;
  background:linear-gradient(160deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.08),0 6px 14px -7px var(--b)}
.az::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);pointer-events:none}
.az svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.az.s{width:30px;height:30px;border-radius:9px}.az.s svg{width:16px;height:16px;stroke-width:2}
.az.m{width:34px;height:34px;border-radius:10px}.az.m svg{width:18px;height:18px}
.az.xl{width:56px;height:56px;border-radius:16px}.az.xl svg{width:28px;height:28px;stroke-width:1.8}
.man{--a:#FFC857;--b:#F08C12}.mad{--a:#6C86FF;--b:#3346C9}.fol{--a:#4FD88E;--b:#1C9A58}.aula{--a:#3CD3E4;--b:#0B8EA8}.alt{--a:#FF9A5E;--b:#D9622B}
.proj{--a:#FF9A5E;--b:#D9622B}.est{--a:#3CD3E4;--b:#0B8EA8}.cad{--a:#8C95A6;--b:#4A5263}.ide{--a:#FFD66B;--b:#E9A21E}.bib{--a:#FF8FAE;--b:#D2456F}.fin{--a:#4FD88E;--b:#1C9A58}.cnt2{--a:#5FB2FF;--b:#2E6EE0}.age{--a:#6C86FF;--b:#3346C9}.tare{--a:#FF9A5E;--b:#D9622B}
.vitrine{display:flex;flex-wrap:wrap;gap:14px}
.vitrine div{display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:20px;background:var(--sup);color:var(--tinta);box-shadow:var(--sombra-s),var(--brilho);font-weight:700}
.vitrine small{display:block;font-size:12px;font-weight:600;color:var(--apag)}
/* ícone simples de cabeçalho de cartão (sem azulejo) */
.ci{color:var(--apag);display:grid;place-items:center}

/* ---------- clima: só o astro, com brilho suave ---------- */
.ceu{display:flex;align-items:center;gap:12px}
.ceu svg{display:block;flex:none}
.ceu b{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ceu small{display:block;font-size:12px;color:var(--apag);font-weight:600;line-height:1.3}

/* ---------- computador ---------- */
.dwrap{position:relative}
.desk{width:1240px;height:800px;transform-origin:0 0;border-radius:24px;overflow:hidden;display:flex;background:var(--luz),var(--fundo);color:var(--tinta);box-shadow:0 30px 80px -40px rgba(0,0,0,.35)}
.side{width:248px;flex:none;display:flex;flex-direction:column;gap:2px;padding:20px 14px;background:var(--sup);margin:16px 0 16px 16px;border-radius:24px;box-shadow:var(--sombra),var(--brilho)}
.sd-top{display:flex;align-items:center;gap:10px;padding:0 6px 12px}
.sd-top svg.lg{width:30px;height:30px;border-radius:9px;display:block}
.sd-top b{font-size:17px;font-weight:800;flex:1}
.ibtn{width:36px;height:36px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--apag)}
.cap{display:flex;align-items:center;gap:10px;height:44px;border-radius:12px;border:0;background:linear-gradient(180deg,#E3703A,var(--marca));color:#fff;font-weight:700;padding:0 14px;margin:0 0 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px -10px var(--marca)}
.cap kbd{margin-left:auto;font:600 12px Manrope;opacity:.8}
.gt{font-size:12px;font-weight:600;color:var(--apag);padding:12px 12px 4px}
.it{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;color:var(--tinta);font-size:15px;position:relative}
.it svg{color:color-mix(in srgb,var(--tinta) 70%,transparent)}
.it .ct{margin-left:auto;font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:999px;background:var(--marca);color:#fff;display:grid;place-items:center;padding:0 6px}
.it.on{background:var(--marca-s);color:var(--marca-f);font-weight:700}
.it.on svg{color:var(--marca)}
.it.on::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--marca)}
:root[data-tema=escuro] .it.on{color:#FFA678}
.sd-pe{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--linha)}
.perfil{display:flex;align-items:center;gap:10px;padding:10px 12px 0}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#F2A877,var(--marca));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.perfil small{display:block;color:var(--apag);font-size:12px;line-height:1.2}.perfil b{font-size:13px;display:block;line-height:1.3}

.hoje{flex:1;overflow:hidden;padding:28px 40px 32px 32px;display:flex;flex-direction:column;gap:18px}
.h-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.h-top small.d{display:block;font-size:15px;color:var(--apag)}
.h-top h2{margin:0;font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.h-top .acoes{justify-self:end;display:flex;gap:12px;align-items:center}
.busca{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 14px;border-radius:999px;background:var(--sup);box-shadow:var(--sombra-s),var(--brilho);color:var(--apag);font-size:13px;width:200px}
.busca kbd{margin-left:auto;font:600 12px Manrope;padding:2px 6px;border-radius:6px;background:var(--afund)}
.rbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--sup);box-shadow:var(--sombra-s),var(--brilho);display:grid;place-items:center;color:var(--tinta);flex:none}
.grade{display:grid;gap:16px;flex:1;min-height:0;grid-template-columns:repeat(4,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"dupla dupla av av" "tl tl tar tar" "tl tl foco foco"}
.k{background:var(--sup);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;box-shadow:var(--sombra),var(--brilho);position:relative}
.kh{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;white-space:nowrap}
.kh .ci svg{width:18px;height:18px}
.kh .mais{margin-left:auto;font-size:13px;font-weight:700;color:var(--marca-f)}
:root[data-tema=escuro] .kh .mais{color:#FFA678}
.lbl{font-size:12px;font-weight:600;color:var(--apag)}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.mid{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--afund);color:var(--tinta);white-space:nowrap}
.chip.al{background:var(--marca-s);color:var(--marca-f)}
:root[data-tema=escuro] .chip.al{color:#FFA678}
.k.dupla{grid-area:dupla;flex-direction:row;padding:0;gap:0}
.dupla>div{flex:1;display:flex;gap:14px;align-items:center;padding:20px}
.dupla>div+div{border-left:1px solid var(--linha)}
.dupla .tx{display:flex;flex-direction:column;gap:2px}
.dupla .tx small{font-size:12px;font-weight:700;color:var(--apag)}
.dupla .tx b{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dupla .tx span{font-size:13px;color:var(--apag)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:52px 34px 1fr;gap:12px;align-items:center;padding:8px 0}
.tl .h{font-size:13px;font-weight:700;color:var(--apag)}
.tl b{display:block;font-size:15px;font-weight:700;line-height:1.35}.tl small{color:var(--apag);font-size:13px}
.tf{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tf li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linha)}
.tf li:first-child{border-top:0}
.ck{width:24px;height:24px;border-radius:50%;border:1.8px solid color-mix(in srgb,var(--apag) 50%,transparent);flex:none;display:grid;place-items:center;color:#fff}
.ck svg{width:14px;height:14px;stroke-width:2.6;display:none}
.ok .ck{background:linear-gradient(160deg,#4FD88E,var(--feito));border-color:transparent}.ok .ck svg{display:block}
.ok .tx,.ok .tx b{color:var(--apag);text-decoration:line-through}
.tf .tx{flex:1;font-size:15px}
.tag{font-size:12px;font-weight:700;color:var(--apag);white-space:nowrap}.tag.at{color:var(--atraso)}
:root[data-tema=escuro] .tag.at{color:#FF7A70}
.foco .tm{display:flex;align-items:center;gap:16px}
.bt{height:44px;padding:0 20px;border-radius:999px;border:0;background:linear-gradient(180deg,#E3703A,var(--marca));color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px -10px var(--marca)}
.bt.sec{background:var(--afund);color:var(--tinta);box-shadow:none}
.barra-p{height:8px;border-radius:9px;background:var(--afund);overflow:hidden;flex:1}.barra-p i{display:block;height:100%;background:linear-gradient(90deg,#F08A4B,var(--marca));border-radius:9px}
.k.tlk{grid-area:tl}.k.tar{grid-area:tar}.k.foco{grid-area:foco}

/* ---------- avisos: faixa de cor, sem cartão ---------- */
.faixa{display:flex;gap:10px;overflow:hidden}
.av-i{flex:1 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:16px;font-size:15px;font-weight:600;white-space:nowrap;
  background:linear-gradient(90deg,color-mix(in srgb,var(--b) 14%,transparent),color-mix(in srgb,var(--b) 3%,transparent));--b:#D9622B}
.av-i small{display:block;font-size:12px;font-weight:600;color:var(--apag)}
.av-i .acao{margin-left:auto;padding-left:12px;font-size:13px;font-weight:700;color:var(--b)}
:root[data-tema=escuro] .av-i .acao{filter:brightness(1.35)}
.av-i.c-alt{--b:#D9622B}.av-i.c-fol{--b:#1C9A58}.av-i.c-aula{--b:#0B8EA8}.av-i.c-ide{--b:#E9A21E}.av-i.c-at{--b:#C2362F}
.pts{display:flex;gap:5px;justify-content:center}.pts i{width:6px;height:6px;border-radius:50%;background:var(--linha)}.pts i.on{width:16px;border-radius:9px;background:var(--marca)}
/* lista de avisos na Agenda: trilho de cor à esquerda */
.avl{display:flex;flex-direction:column}
.avl .r{display:flex;align-items:center;gap:12px;padding:12px 4px 12px 14px;position:relative;border-top:1px solid var(--linha)}
.avl .r:first-child{border-top:0}
.avl .r::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--b,#D9622B)}
.avl .r .tx{flex:1}.avl b{display:block;font-size:15px;line-height:1.3}.avl small{font-size:13px;color:var(--apag)}
.avl .acao{font-size:13px;font-weight:700;color:var(--marca-f)}
:root[data-tema=escuro] .avl .acao{color:#FFA678}

/* ---------- celulares ---------- */
.phones{display:flex;flex-wrap:wrap;gap:28px 24px}
.ph{display:flex;flex-direction:column;gap:8px}
.ph>small{font-size:13px;font-weight:700;color:color-mix(in srgb,var(--pg-tx) 60%,transparent);padding-left:8px;max-width:360px}
.tela{width:360px;height:740px;border-radius:44px;background:var(--luz),var(--fundo);color:var(--tinta);position:relative;overflow:hidden;box-shadow:0 30px 70px -36px rgba(0,0,0,.4),0 0 0 8px color-mix(in srgb,var(--pg-tx) 6%,transparent)}
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:700;position:relative;z-index:1}
.sb i{width:64px;height:12px;border-radius:9px;background:var(--tinta);opacity:.85}
.rol{position:absolute;inset:44px 0 0;overflow:hidden;display:flex;flex-direction:column}
.cab{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px}
.cab .av{width:32px;height:32px;font-size:12px}
.cab h3{margin:0 0 0 4px;flex:1;font-size:20px;font-weight:800;letter-spacing:-.02em}
.cab .rbtn{width:40px;height:40px}
.pills{position:relative;flex:none}
.pills .tr{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 12px;scrollbar-width:none}.pills .tr::-webkit-scrollbar{display:none}
.pills::after{content:"";position:absolute;right:0;top:0;bottom:8px;width:40px;background:linear-gradient(90deg,transparent,var(--fundo));pointer-events:none}
.pl{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--linha);background:transparent;font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--tinta)}
.pl em{font-style:normal;color:var(--apag);font-weight:600}
.pl.on{background:var(--tinta);border-color:var(--tinta);color:var(--fundo)}.pl.on em{color:inherit;opacity:.7}
.cnt{flex:1;overflow:hidden;padding:4px 16px 130px;display:flex;flex-direction:column;gap:12px}
.cnt>*{flex:none}
.ola2{padding:4px 16px 10px;display:flex;flex-direction:column;gap:6px}
.ola2 .l1{display:flex;align-items:center;gap:10px}
.ola2 h3{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.ola2 .l2{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--apag);padding-left:2px}
.ola2 .l2 .grow{flex:1}.ola2 .l2 b{color:var(--tinta)}
.sec-t{font-size:13px;font-weight:700;color:var(--apag);padding:4px 4px 0;display:flex;justify-content:space-between}
.lin{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--sup);box-shadow:var(--sombra-s),var(--brilho)}
.lin .tx{flex:1}.lin b{display:block;font-size:15px;font-weight:700;line-height:1.3}.lin small{color:var(--apag);font-size:13px}
.lin .ck{width:26px;height:26px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.kp{border-radius:22px;padding:16px;gap:10px}
.k.dupla.kp{padding:0}.kp.dupla>div{padding:14px;gap:12px;flex-direction:column;align-items:flex-start}
.kp.dupla .tx b{font-size:17px}
.faixa.cel{margin:0 -16px;padding:0 16px;scroll-snap-type:x mandatory}
.faixa.cel .av-i{flex:0 0 calc(100% - 28px);white-space:normal;scroll-snap-align:start}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--sup);border-radius:22px;padding:8px 6px;box-shadow:var(--sombra-s),var(--brilho)}
.semana div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:14px;font-size:12px;color:var(--apag)}
.semana b{font-size:15px;color:var(--tinta)}.semana .on{background:var(--tinta);color:var(--fundo)}.semana .on b{color:var(--fundo)}
.grp,.avl.k2{border-radius:22px;background:var(--sup);box-shadow:var(--sombra-s),var(--brilho);overflow:hidden}
.avl.k2{padding:4px 12px}
/* barra de baixo: vidro fosco e um esmaecido atrás */
.esmaece{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:2;pointer-events:none;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--fundo) 88%,transparent) 55%,var(--fundo));}
.dock{position:absolute;z-index:3;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:var(--vidro);

/* ---------- guardar: banco do artifact + reserva local ---------- */
const LS="seiva3";let DB=null,DOC=null,salvaT=null,carregou=0;
function salvaLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
let gravando=null,pendente=0;
async function grava(){if(!DOC)return;if(gravando){pendente=1;return;}gravando=1;try{await DOC.set({json:JSON.stringify(S),ts:S.ts});}catch(e){}gravando=null;if(pendente){pendente=0;grava();}}
function salva(){S.ts=Date.now();salvaLocal();clearTimeout(salvaT);salvaT=setTimeout(grava,700);}
function migra(o){const b=BASE();const r=Object.assign(b,o||{});["areas","avisos","silencio","vistos"].forEach(k=>r[k]=Object.assign(BASE()[k],(o||{})[k]||{}));return r;}
function carregaLocal(){try{const t=localStorage.getItem(LS);if(t){S=migra(JSON.parse(t));carregou=1;}}catch(e){}}
async function ligaBanco(){
 try{if(!window.claude||!claude.use)return;const db=await claude.use("db"),us=await claude.use("user");if(!db||!us)return;
  const id=await us.id();if(!id)return;DB=db;DOC=db.collection("data/users/"+id).doc("seiva");
  const snap=await DOC.get();const d=snap&&snap.exists?snap.data():null;
  if(d&&d.json){const o=JSON.parse(d.json);if(!S.ts||(o.ts||0)>=(S.ts||0)){S=migra(o);salvaLocal();aplicaTema();if(S.ob)UI.obEt="";render();}else grava();}
  else if(S.ob)grava();
 }catch(e){}
}

/* ---------- tema ---------- */
function temaEf(){if(S.tema!=="auto")return S.tema;const dt=document.documentElement.dataset.theme;if(dt==="dark")return "escuro";if(dt==="light")return "claro";return matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";}
function aplicaTema(){document.documentElement.dataset.tema=temaEf();document.documentElement.dataset.ic="vidro";}

let avatar=(sz)=>S.foto?'<span class="av foto-av" style="background-image:url('+S.foto+')'+(sz?';width:'+sz+'px;height:'+sz+'px':'')+'"></span>':'<span class="av"'+(sz?' style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz/3)+'px"':'')+'>'+esc(ini(S.nome))+'</span>';

/* turnos com horário que tocam um instante (inclui o de ontem que passa da meia-noite) */
function blocosTurno(k){const out=[];[addD(k,-1),k].forEach(d=>tiposDia(d).forEach(t=>{if(!t.h1)return;let a=min(t.h1),b=min(t.h2||t.h1);if(b<=a)b+=1440;const off=difD(k,d)*1440;out.push({t,d,a:a+off,b:b+off});}));return out;}
function turnoAgora(){const k=HOJE(),m=agoraMin();const L=blocosTurno(k).filter(x=>x.t.k==="turno");const cur=L.find(x=>m>=x.a&&m<x.b);if(cur)return {on:1,...cur,rest:cur.b-m,pct:(m-cur.a)/(cur.b-cur.a)};
 for(let i=0;i<8;i++){const d=addD(k,i);const n=blocosTurno(d).filter(x=>x.t.k==="turno"&&x.d===d).map(x=>({...x,abs:i*1440+x.a})).filter(x=>x.abs>m).sort((a,b)=>a.abs-b.abs)[0];if(n)return {on:0,...n,falta:n.abs-m};}
 return null;}

/* ---------- avisos do dia: pilha montada por regras ---------- */
const NIV=[null,["Atrasado","#C2362F"],["Agora","#D9622B"],["Hoje","#E9A21E"],["Em breve","#0B8EA8"],["Sugestões","#1C9A58"]];
function avisos(){const k=HOJE(),m=agoraMin(),A=[],on=S.avisos,ign=S.semAviso||[];
 const add=o=>{if(!ign.includes(o.r))A.push(o);};
 if(on.tarefas)atrasadas().forEach(t=>add({id:"ta"+t.id,n:1,r:"tarefa-atrasada",ic:["tare","tar"],t:t.t,s:"atrasada · "+fCurta(t.d),acao:["Fazer hoje","hojeT",t.id],vem:"Tarefas · prazo "+fCurta(t.d),regra:"tarefa com prazo vencido"}));
 if(on.contas)S.pagar.filter(p=>!p.pago&&p.d<k).forEach(p=>add({id:"pa"+p.id,n:1,r:"conta-vencida",ic:["cnt2","cart"],t:p.t,s:"venceu "+fCurta(p.d)+(p.v?" · "+brl(p.v):""),acao:["Pagar","pagar",p.id],vem:"A pagar · vence "+fCurta(p.d),regra:"conta vencida e não paga"}));
 if(on.turno){blocosTurno(k).concat(blocosTurno(addD(k,1)).map(x=>({...x,a:x.a+1440,b:x.b+1440}))).forEach(x=>{const f=x.a-m;if(f>0&&f<=120&&!A.some(a=>a.id==="tn"+x.t.id+x.d))add({id:"tn"+x.t.id+x.d,n:2,r:"turno-perto",ic:[x.t.c,x.t.g],t:x.t.n+" às "+fHH(x.t.h1),s:x.t.k==="turno"?"começa em breve":"hoje",q:x.t.h1,cont:"em "+fDur(f),vem:"Escala · "+x.t.n,regra:"1 h antes de cada turno ou marcação com horário"});});}
 comps(k).forEach(c=>{const f=min(c.h)-m;if(c.h&&f>0&&f<=120)add({id:"co"+c.id,n:2,r:"comp-perto",ic:["age","cal"],t:c.t,s:c.local||"compromisso",q:c.h,cont:"em "+fDur(f),vem:"Agenda · compromisso",regra:"2 h antes de compromissos"});else if(c.h&&f>120)add({id:"co"+c.id,n:3,r:"comp-hoje",ic:["age","cal"],t:c.t,s:"hoje às "+c.h,vem:"Agenda · compromisso",regra:"compromissos do dia"});});
 if(on.tarefas){const h=pend().filter(t=>t.d===k);if(h.length)add({id:"th",n:3,r:"tarefas-hoje",ic:["tare","tar"],t:h.length===1?h[0].t:h.length+" tarefas para hoje",s:h.length===1?"prazo hoje":h.slice(0,2).map(t=>t.t).join(", "),acao:["Ver","ir","tarefas"],vem:"Tarefas · prazo hoje",regra:"tarefas com prazo no dia"});}
 if(on.provas)S.provas.filter(p=>!p.feita&&p.d>=k&&difD(k,p.d)<=7).forEach(p=>{const n=difD(k,p.d);add({id:"pr"+p.id,n:n===0?3:4,r:"prova",ic:["aula","capelo"],t:p.t,s:n===0?"hoje"+(p.h?" às "+p.h:""):fData(p.d)+" · faltam "+n+" dias",vem:"Agenda · provas",regra:"1 semana, 1 dia e no dia da prova"});});
 if(on.contas)S.pagar.filter(p=>!p.pago&&p.d>=k&&difD(k,p.d)<=3).forEach(p=>{const n=difD(k,p.d);add({id:"pa"+p.id,n:n===0?3:4,r:"conta-perto",ic:["cnt2","cart"],t:p.t,s:(n===0?"vence hoje":"vence "+fCurta(p.d))+(p.v?" · "+brl(p.v):""),acao:["Pagar","pagar",p.id],vem:"A pagar · vence "+fCurta(p.d),regra:"3 dias antes e no dia"});});
 tiposDia(addD(k,1)).filter(t=>t.av==="vespera").forEach(t=>add({id:"ve"+t.id,n:4,r:"vespera",ic:[t.c,t.g],t:"Amanhã: "+t.n,s:t.h1?"às "+t.h1:"o dia todo",vem:"Escala · "+t.n,regra:"na véspera de tipos de dia com aviso"}));
 if(on.sug){const am=principal(addD(k,1));const sd=semData()[0];
  if(am&&am.k==="folga"&&!S.sugIgn["fol"+addD(k,1)])add({id:"sf",n:5,r:"sug-folga",ic:["fol","folha"],t:"Amanhã é "+am.n.toLowerCase(),s:sd?"bom dia para: "+sd.t:"um bom dia para descansar",acao:sd?["Agendar","agendaT",sd.id]:null,vem:"Escala · "+am.n+" amanhã",regra:"sugestões em dias livres e folgas"});
  else{for(let i=1;i<=6&&sd;i++){const d=addD(k,i);if(!tiposDia(d).length&&!tarefasDe(d).length&&!S.sugIgn["liv"+d]){add({id:"sl",n:5,r:"sug-livre",ic:["ide","ideia"],t:sd.t,s:DS[dSem(d)]+" está livre",acao:["Agendar","agendaD",sd.id+"|"+d],vem:"Agenda · "+DS[dSem(d)]+" sem nada marcado",regra:"sugestões em dias livres e folgas"});break;}}}}
 return A.sort((a,b)=>a.n-b.n);}

/* ---------- sugestão de dia cheio ---------- */
function sugestao(){const k=HOJE();for(let i=0;i<7;i++){const d=addD(k,i);const p=principal(d);const n=pend().filter(t=>t.d===d).length;const tem=tiposDia(d).length+comps(d).length;
  if(n>=4&&tem&&!S.sugIgn["mv"+d]){for(let j=1;j<=3;j++){const d2=addD(d,j);const p2=principal(d2);if(p2&&p2.k==="folga"||(!tiposDia(d2).length&&pend().filter(t=>t.d===d2).length<2)){
   const det=[p?p.n.toLowerCase():"",comps(d).length?comps(d).length+" compromisso"+(comps(d).length>1?"s":""):"",n+" tarefas"].filter(Boolean).join(", ");
   return {d,d2,txt:(i===0?"Hoje":DS[dSem(d)][0].toUpperCase()+DS[dSem(d)].slice(1))+" está cheio"+(dSem(d)===0||dSem(d)===6?"":"a")+": <b>"+esc(det)+"</b>. Mover 2 tarefas para "+(j===1&&i===0?"amanhã":DS[dSem(d2)])+(p2?", que é "+esc(p2.n.toLowerCase()):", que está livre")+"?"};}}}}
 return null;}

/* ---------- métricas ---------- */
function semanaFeitas(){const s=segunda(HOJE());return Array.from({length:7},(_,i)=>{const d=addD(s,i);return [DS1[(i+1)%7],feitasEm(d),d];});}
function sequencia(){let k=HOJE(),n=0;if(!feitasEm(k))k=addD(k,-1);for(let i=0;i<400;i++){const p=principal(k);if(feitasEm(k))n++;else if(!(p&&p.k==="folga"))break;k=addD(k,-1);}return n;}
function tempoSemana(){const s=segunda(HOJE()),h=HOJE();let trab=0;for(let i=0;i<7;i++){const d=addD(s,i);if(d>h)break;tiposDia(d).filter(t=>t.k==="turno"&&t.h1).forEach(t=>{let a=min(t.h1),b=min(t.h2||t.h1);if(b<=a)b+=1440;trab+=b-a;});}
 const fo={};S.foco.filter(f=>f.d>=s&&f.d<=h).forEach(f=>{fo[f.a||"Foco"]=(fo[f.a||"Foco"]||0)+f.m;});
 const L=[["Trabalho",trab,"#3346C9"]];Object.entries(fo).forEach(([n,m],i)=>L.push([n,m,["#0B8EA8","#D9622B","#1C9A58","#E9A21E"][i%4]]));return L.filter(x=>x[1]>0);}
function pctSemana(){const s=segunda(HOJE());const L=S.tarefas.filter(t=>t.d&&t.d>=s&&t.d<=addD(s,6));return L.length?Math.round(L.filter(t=>t.f).length/L.length*100):0;}
function primeirosPassos(){return [["escala","Montar a escala do mês","pinte os próximos dias",Object.keys(S.dias).some(d=>d>=HOJE()&&S.dias[d].length),"mad",null],["tarefa","Primeira tarefa","algo para fazer esta semana",S.tarefas.length>0,"tare",null],["conta","Uma conta a pagar","o app avisa antes de vencer",S.pagar.length>0,"fin","cart"]];}

 for(let i=1;i<=nd;i++){const k=m+"-"+pad(i);const T=tiposDia(k);const ev=[...comps(k).map(c=>c.t),...S.provas.filter(p=>p.d===k).map(p=>p.t),...S.pagar.filter(p=>p.d===k&&!p.pago).map(p=>p.t)];
  s+='<span class="cd'+(k===(modo==="escala"?"":sel)?' on':'')+(k<h?' pas':'')+'" data-a="'+(modo==="escala"?"pinta":"dia")+'" data-v="'+k+'"><b class="num">'+i+'</b><span class="tps">'+T.slice(0,g?2:1).map(t=>azT(t,"s")).join("")+'</span>'+(g&&ev[0]?'<i class="ev">'+esc(ev[0])+'</i>':(!g&&ev.length?'<i class="pt2"></i>':''))+'</span>';}

 S.provas.filter(p=>p.d===d).forEach(p=>L.push(lin(az("aula","","capelo"),esc(p.t),"prova"+(p.h?" · "+p.h:""),"","",' data-a="prova" data-v="'+p.id+'"')));
 tarefasDe(d).forEach(t=>L.push(lin(ckT(t),esc(t.t),t.f?"feita":"tarefa","",t.f?"feita":"",' data-a="tarefa" data-v="'+t.id+'"')));

/* entende "amanhã", "hoje", "sexta", "toda sexta", "dia 12" */
function entende(txt){let t=" "+txt+" ",d=null,rep="";const h=HOJE();
 const dias=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];const norm=w=>w.replace("terca","terça").replace("sabado","sábado");
 const B="(?=[\\s,.;!?])",A0="(\\s)";const rx=(p)=>new RegExp(A0+p+B,"i");const tira=m=>{t=t.replace(m[0],m[1]);};
 const prox=i=>{let k=addD(h,1);for(let j=0;j<7;j++){if(dSem(k)===i)break;k=addD(k,1);}return k;};
 let m;
 if(m=t.match(rx("(?:toda|todo)\\s+(dia|domingo|segunda|terça|terca|quarta|quinta|sexta|sábado|sabado|semana|folga)(?:-feira)?"))){const w=norm(m[2].toLowerCase());if(w==="dia"){rep="dia";d=h;}else if(w==="folga")rep="folga";else if(w==="semana"){rep="sem";d=h;}else{rep="sem";const i=dias.indexOf(w);d=dSem(h)===i?h:prox(i);}tira(m);}
 else if(m=t.match(rx("hoje"))){d=h;tira(m);}
 else if(m=t.match(rx("amanh[ãa]"))){d=addD(h,1);tira(m);}
 else if(m=t.match(rx("depois de amanh[ãa]"))){d=addD(h,2);tira(m);}
 else if(m=t.match(rx("(?:na |no |nesta |neste |próxima |proxima )?(domingo|segunda|terça|terca|quarta|quinta|sexta|sábado|sabado)(?:-feira)?"))){d=prox(dias.indexOf(norm(m[2].toLowerCase())));tira(m);}
 else if(m=t.match(rx("dia\\s+(\\d{1,2})"))){let y=+h.slice(0,4),mm=+h.slice(5,7);const n=+m[2];if(n<+h.slice(8))mm++;if(mm>12){mm=1;y++;}d=y+"-"+pad(mm)+"-"+pad(n);tira(m);}
 t=t.replace(/\s+(na|no|de|para|pra)\s*$/i,"").replace(/\s{2,}/g," ").trim();return {t,d,rep};}

 if(t.f){t.f=0;t.fd=null;S.brotos=Math.max(0,(S.brotos||0)-1);salva();render();return;}
 t.f=1;t.fd=HOJE();S.brotos=(S.brotos||0)+1;
 if(t.rep){const n=proxRep(t);if(n!==undefined&&!S.tarefas.some(x=>x.serie===(t.serie||t.id)&&!x.f&&x.d===n)){t.serie=t.serie||t.id;S.tarefas.push({...clone(t),id:uid(),f:0,fd:null,d:n,sub:(t.sub||[]).map(s=>({t:s.t,f:0}))});}}

async function inflar(bytes,fmt){const ds=new DecompressionStream(fmt);const s=new Blob([bytes]).stream().pipeThrough(ds);return new Uint8Array(await new Response(s).arrayBuffer());}
const latin=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return s;};
async function lerZip(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=-1;for(let i=u.length-22;i>=Math.max(0,u.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}if(e<0)throw new Error("zip");
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
 for(let k=0;k<n;k++){const met=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);const nome=new TextDecoder().decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
  out[nome]=async()=>{const l2=dv.getUint16(lo+26,true),x2=dv.getUint16(lo+28,true);const d=u.subarray(lo+30+l2+x2,lo+30+l2+x2+cs);const r=met===8?await inflar(d,"deflate-raw"):d;return new TextDecoder().decode(r);};}
 return out;}
const colN=r=>{const m=(r||"").match(/^[A-Z]+/);if(!m)return 0;let n=0;for(const ch of m[0])n=n*26+ch.charCodeAt(0)-64;return n-1;};
const serial=v=>{const n=+v;if(!(n>30000&&n<60000))return v;const d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*864e5);const fr=n%1;return v+" (="+d.toISOString().slice(0,10)+(fr?" "+pad(Math.floor(fr*24))+":"+pad(Math.round(fr*1440)%60):"")+")";};
async function lerXlsx(buf){const z=await lerZip(buf);const xp=new DOMParser();let ss=[];if(z["xl/sharedStrings.xml"]){const d=xp.parseFromString(await z["xl/sharedStrings.xml"](),"text/xml");ss=[...d.getElementsByTagName("si")].map(si=>[...si.getElementsByTagName("t")].map(t=>t.textContent).join(""));}
 let nomes=[];if(z["xl/workbook.xml"]){const d=xp.parseFromString(await z["xl/workbook.xml"](),"text/xml");nomes=[...d.getElementsByTagName("sheet")].map(s=>s.getAttribute("name"));}
 const fol=Object.keys(z).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);let txt="";
 for(let i=0;i<fol.length&&i<6;i++){const d=xp.parseFromString(await z[fol[i]](),"text/xml");txt+="### Planilha: "+(nomes[i]||"folha "+(i+1))+"\n";
  [...d.getElementsByTagName("row")].forEach(row=>{const cel=[];[...row.getElementsByTagName("c")].forEach(c=>{const t=c.getAttribute("t");const v=c.getElementsByTagName("v")[0];let x=v?v.textContent:"";if(t==="s")x=ss[+x]||"";else if(t==="inlineStr")x=[...c.getElementsByTagName("t")].map(q=>q.textContent).join("");else if(t!=="str"&&t!=="b")x=serial(x);cel[colN(c.getAttribute("r"))]=x;});
